# DHCP overlay:
#   docker compose -f compose.yaml -f compose.dhcp.yaml up -d
# Stacks with the others, e.g. -f compose.yaml -f compose.prod.yaml -f compose.dhcp.yaml
#
# For a real deployment, prefer the Debian package. vialo/vialo-dhcp/debian/
# has a systemd unit with a far tighter sandbox than a container gets here.
services:
  vialo-dhcp:
    build:
      context: ./
      dockerfile: ./vialo-dhcp/Dockerfile
      args:
        PROFILE: ${PROFILE:-release}
    restart: unless-stopped

    # DHCP clients broadcast from 0.0.0.0, and the VLAN lookup reads link
    # information over netlink. Both need the host's own network stack; on a
    # bridge network this server would never see a real client.
    network_mode: host

    # Mirrors CapabilityBoundingSet in debian/service: bind UDP/67, and
    # SO_BINDTODEVICE when `interfaces` pins one.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - NET_RAW

    volumes:
      # /app/vialo.toml is where the image looks (VIALO_CONFIG in its Dockerfile).
      - ./vialo.toml:/app/vialo.toml:ro
    environment:
      # host networking, so postgres is reached over the published loopback
      # port below rather than by service name.
      DATABASE_URL: postgresql://${POSTGRES_ROOT_USERNAME}:${POSTGRES_ROOT_PASSWORD}@127.0.0.1:5432/vialo
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    # Needed by the host-networked container above. The dev overlay publishes
    # this too. Prod does not, which is why it is repeated here.
    ports:
      - "127.0.0.1:5432:5432"
