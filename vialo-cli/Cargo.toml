[package]
name = "vialo-cli"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
dotenv = "0.15.0"
ipnetwork = "0.21.1"
rand = "0.10.3"
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
vialo-api = { version = "0.0.2", path = "../vialo-api", features = ["import"] }
vialo-common = { version = "0.1.0", path = "../vialo-common" }

[[bin]]
name = "vialo"
path = "src/main.rs"
