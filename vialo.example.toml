timezone = "Europe/Berlin"

[public]
cors_origins = ["http://localhost:3000", "http://localhost:3001", "http://127.0.0.1:3000", "http://127.0.0.1:3001"]
listen = "0.0.0.0:8000"

[hooks]
# Unauthenticated. Do not publish the port.
listen = "0.0.0.0:8011"

[email]
domain = "xyz.example.com"

[email.url]
unsubscribe = "https://xyz.example.com/unsub/"
post = "https://xyz.example.com/post/"
board = "https://xyz.example.com/board/"
preferences = "https://xyz.example.com/prefs/"

# vialo-dhcp. DATABASE_URL stays in the environment.
[dhcp]
# Server identifier IP — must be an IP on the listen interface.
siaddr = "192.0.2.1"
# Interfaces to bind. Empty binds all of them; pin a single one in production,
# which is what enables SO_BINDTODEVICE.
interfaces = []
#listen = "0.0.0.0:67"
# Lease duration in seconds. T1/renew and T2/rebind are derived from it.
#lease_time = 10800
# How long a declined address stays quarantined, in seconds.
#probation = 3600
# Option 82 Agent Circuit ID VLAN parsing: off, ascii, or binary.
#circuit_id_vlan = "ascii"
#pg_max_connections = 5

[auth]
type = "mock"
uuid = "1d63a916-36f9-4a14-9f9f-730b1fd58c12"
email = "test@example.com"

[org]
name = "XYZ e.V."
domain = "xyz.ac"
short_name = "XYZ"
impressum = "Straße 111, 12345 Hamburg – https://xyz.example.com"

[ui]
copyright = "X-ray-Yankee-Zulu e.V."
appname_user = "XYZ"
appname_admin = "XYZ Admin"
appname_user_long = "X-ray-Yankee-Zulu"
impressum_url = "https://xyz.example.com/impressum"
privacy_policy_url = "https://xyz.example.com/datenschutz"

# Device credential for the kiosk: /laundry/kiosk?key=<token>.
# Without it, the kiosk renders status but cannot read the queue.
[bookables.kiosk]
token = "change-me"
asset_types = [1]
