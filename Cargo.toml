[workspace]
resolver = "2"
members = ["vialo-api", "vialo-common", "vialo-dhcp"]

[workspace.package]
rust-version = "1.99"

# Unoptimized rav1e is the worst of a slow dev encode so use --release when testing uploads
[profile.dev.package.rav1e]
opt-level = 3

# Incremental profile for faster builds
# Select with the PROFILE build arg: `PROFILE: fast` under build.args
[profile.fast]
inherits = "release"
incremental = true
