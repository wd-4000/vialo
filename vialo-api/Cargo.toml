[package]
name = "vialo-api"
version = "0.0.2"
edition = "2024"
rust-version.workspace = true
default-run = "vialo-api"

[package.metadata.deb]
maintainer-scripts = "debian/"
systemd-units = { enable = true }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
default = ["printer", "nms", "email"]
printer = []
migrate = []
import = []
email = []
nms = ["mac_address/serde"]
# rav1e assembly needs nasm at build time
media-asm = ["ravif/asm"]
# HEIF/AVIF uploads - we need to link libheif
media-heif = ["dep:libheif-rs"]
# Builds libheif from source and links it statically (Docker/musl)
# Needs cmake, g++ and static libde265 + libaom
media-heif-static = ["media-heif", "libheif-rs/embedded-libheif"]

[dependencies]

axum = { version = "0.8.9", features = ["macros", "ws"] }
axum-extra = { version = "0.12.6", features = ["query", "typed-header"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenv = "0.15.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1"
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "tls-native-tls",
    "postgres",
    "json",
    "chrono",
    "uuid",
    "mac_address",
    "ipnetwork",
] }
sqlx-conditional-queries = { version = "0.4.0", features = ["postgres"] }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
uuid = { version = "1.29.2", features = ["serde", "v4"] }
reqwest = { version = "0.13.5", features = ["json", "query", "socks", "cookies", "native-tls"], default-features = false}
urlencoding = "2.1.3"
xml_dom = "0.2.8"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
futures = "0.3.34"
headers = "0.4.2"
anyhow = "1.0.104"
tracing = "0.1.44"
lettre = { version = "0.11.23", features = ["sendmail-transport", "tokio1", "tokio1-native-tls"] }
handlebars = "6.4.4"
yaml-rust2 = "0.13.0"
rand = "0.10.3"
mac_address = "1.2.1"
serde_repr = "0.1.21"
vialo-common = { path = "../vialo-common" }
icu = { version = "2.4.0", features = ["compiled_data", "serde"] }
pulldown-cmark = "0.13.6"
ammonia = "4.2.4"
cfg-if = "1.0.5"
itertools = "0.15.0"
serde_with = { version = "3.24.0", features = ["chrono"] }
ory-kratos-client = "26.2.0"
utoipa = { version = "6.0.0", features = ["axum_extras", "uuid", "chrono", "macros"] }
utoipauto = "0.3.1"
chacha20poly1305 = { version = "0.11.0" }
hex = "0.4"
secrecy = "0.10.3"
ipnetwork = { version = "0.21.1", features = ["serde"] }
governor = { version = "0.10.4", features = ["dashmap"] }
dashmap = "6.2.1"
strum = { version = "0.28.0", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
ravif = { version = "0.13.0", default-features = false, features = ["threading"] }
rayon = "1.12.0"
infer = "0.22.0"
glob = "0.3.4"
zip = { version = "9.5.0", default-features = false }
tokio-util = { version = "0.7.20", features = ["io"] }
libheif-rs = { version = "3.0.0", default-features = false, features = ["v1_17"], optional = true }
schemars = { version = "1.2.3", features = ["preserve_order", "uuid1"] }
#iana-time-zone = "0.1.63"
