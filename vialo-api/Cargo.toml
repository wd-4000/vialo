[package]
name = "vialo-api"
version = "0.0.2"
edition = "2024"
default-run = "vialo-api"

[package.metadata.deb]
maintainer-scripts = "debian/"
systemd-units = { enable = true }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
default = ["printer", "ppsk"]
printer = []
migrate = []
email = []
ppsk = []

[dependencies]

axum = { version = "0.8.9", features = ["macros", "ws"] }
axum-extra = { version = "0.12.6", features = ["query", "typed-header"] }
chrono = { version = "0.4.44", features = ["serde"] }
dotenv = "0.15.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_path_to_error = "0.1"
sqlx = { version = "0.8.6", features = [
    "runtime-tokio-native-tls",
    "postgres",
    "json",
    "chrono",
    "uuid",
    "mac_address",
    "ipnetwork",
] }
sqlx-conditional-queries = { version = "0.3.2", features = ["postgres"] }
tokio = { version = "1.52.2", features = ["full"] }
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
uuid = { version = "1.23.1", features = ["serde", "v4"] }
reqwest = { version = "0.13.3", features = ["json", "socks", "cookies", "native-tls"], default-features = false}
urlencoding = "2.1.3"
xml_dom = "0.2.8"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
futures = "0.3.32"
headers = "0.4.1"
anyhow = "1.0.102"
tracing = "0.1.44"
lettre = "0.11.21"
handlebars = { version = "6.4.0", features = ["dir_source"] }
yaml-rust2 = "0.11.0"
rand = "0.10.1"
mac_address = "1.1.8"
serde_repr = "0.1.20"
toml = "1.1.2"
icu = { version = "2.2.0", features = ["compiled_data", "serde"] }
pulldown-cmark = "0.13.3"
ammonia = "4.1.2"
cfg-if = "1.0.4"
itertools = "0.14.0"
serde_with = { version = "3.19.0", features = ["chrono"] }
ory-kratos-client = "26.2.0"
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid", "chrono", "macros"] }
utoipauto = "0.2.0"
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
hex = "0.4"
secrecy = "0.10.3"
#iana-time-zone = "0.1.63"
