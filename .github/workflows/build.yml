name: Rust

on:
  push:
    branches: ["main"]
    paths:
      - "vialo-api/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: ["main"]
    paths:
      - "vialo-api/**"
      - "Cargo.toml"
      - "Cargo.lock"

env:
  IMAGE: ghcr.io/${{ github.repository }}/vialo-api

jobs:
  build:
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        # Pull requests only build amd64 for validation; arm64 is only built
        # on pushes to main, where the image actually gets published.
        # (The matrix context isn't available in job-level `if`, hence fromJSON.)
        include: >-
          ${{ github.event_name == 'push'
              && fromJSON('[
                {"platform": "linux/amd64", "runner": "ubuntu-24.04"},
                {"platform": "linux/arm64", "runner": "ubuntu-24.04-arm"}
              ]')
              || fromJSON('[
                {"platform": "linux/amd64", "runner": "ubuntu-24.04"}
              ]') }}

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6

      # linux/amd64 -> linux-amd64, for use in cache scopes and artifact names
      - name: Prepare platform slug
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_SLUG=${platform//\//-}" >> $GITHUB_ENV

      # Buildx is required for layer caching and digest pushes
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - name: Build image (push by digest on main)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: . # (rust workspace root)
          file: ./vialo-api/Dockerfile.ci
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # The workflow only triggers on push for the main branch.
          # Tags are applied by the publish job below.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' }}
          # PROFILE build arg defaults to "release" in the Dockerfile
          cache-from: type=gha,scope=${{ env.PLATFORM_SLUG }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_SLUG }}

      - name: Export digest
        if: github.event_name == 'push'
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_SLUG }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      # Builds the spec-builder stage on top of the (locally hot) builder
      # layers and copies openapi.json out. The spec is arch-independent, so
      # one leg suffices.
      - name: Extract OpenAPI spec
        if: matrix.platform == 'linux/amd64'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./vialo-api/Dockerfile.ci
          target: openapi
          outputs: type=local,dest=./openapi-out
          cache-from: type=gha,scope=${{ env.PLATFORM_SLUG }}
          # Persist the spec-builder layers too, so unchanged re-runs are free
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_SLUG }}

      - name: Upload OpenAPI Artifact
        if: matrix.platform == 'linux/amd64'
        uses: actions/upload-artifact@v7
        with:
          name: openapi-spec
          path: ./openapi-out/openapi.json
          if-no-files-found: error

  # Merges the per-arch digests into a single multi-arch manifest and tags it
  publish:
    needs: build

    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-latest

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}

  deploy-docs:
    # This ensures the deploy job only runs after the build job is successful
    needs: build

    # Only deploy Pages from pushes to main, not from pull requests
    if: github.event_name == 'push'

    # Required permissions for GitHub Pages deployments
    permissions:
      pages: write
      id-token: write

    # Links this job to the built-in GitHub Pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Download OpenAPI Artifact
        uses: actions/download-artifact@v8
        with:
          name: openapi-spec
          # Downloads the artifact into a new temporary folder
          path: ./pages-build

      - name: Generate index.html
        run: |
          cat << 'EOF' > ./pages-build/index.html
          <!DOCTYPE html>
          <html>
            <head>
              <title>Vialo API</title>
              <meta charset="utf-8"/>
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <style>body { margin: 0; padding: 0; }</style>
            </head>
            <body>
              <redoc spec-url="openapi.json"></redoc>
              <script src="https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js"></script>
            </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./pages-build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
