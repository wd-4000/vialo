name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    # Applies to all 'run' steps in this job
    defaults:
      run:
        working-directory: ./vialo-api

    steps:
    - uses: actions/checkout@v4
    
    # - name: Build
    #   run: cargo build --verbose
      
    # - name: Run tests
    #   run: cargo test --verbose
      
    - name: Generate OpenAPI spec
      run: cargo run --bin openapi-spec -- openapi.json
      
    - name: Upload OpenAPI Artifact
      uses: actions/upload-artifact@v4
      with:
        name: openapi-spec
        # Since this is an action, it ignores the default working directory above.
        # You must include the subfolder path explicitly.
        path: ./vialo-api/openapi.json
        if-no-files-found: error
